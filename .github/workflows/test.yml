name: Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - '.apm/skills/jl-recon/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '.apm/skills/jl-recon/**'
      - '.github/workflows/test.yml'

jobs:
  pester-tests:
    name: Pester Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PowerShell
        run: |
          # PowerShell is pre-installed on windows-latest
          $PSVersionTable.PSVersion
        shell: pwsh

      - name: Install Pester
        run: |
          Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck
        shell: pwsh

      - name: Run Pester Test Suite
        run: |
          $ErrorActionPreference = 'Stop'
          $testPaths = @(
            ".apm/skills/jl-recon/tests/pester/mode2-checks.tests.ps1",
            ".apm/skills/jl-recon/tests/pester/mode2-workflow.tests.ps1",
            ".apm/skills/jl-recon/tests/pester/mode3-checks.tests.ps1",
            ".apm/skills/jl-recon/tests/pester/mode3-workflow.tests.ps1"
          )

          foreach ($testPath in $testPaths) {
            Write-Host "Running tests from: $testPath"
            $result = Invoke-Pester -Path $testPath -Output Detailed -PassThru
            if ($result.Result -ne 'Passed') {
              throw "Pester tests failed in $testPath"
            }
          }
        shell: pwsh
        continue-on-error: false

  bats-tests:
    name: Bats Tests (Edge Cases & Resolution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bash
        run: |
          echo "Bash version:"
          bash --version

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats --version

      - name: Run Label Resolution Tests
        run: |
          testPath=".apm/skills/jl-recon/tests/bats/label-resolution.bats"
          echo "Running tests from: $testPath"
          set -o pipefail
          bats "$testPath" --formatter tap | tee bats-results.tap
          cat bats-results.tap

      - name: Upload Bats Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-results
          path: bats-results.tap
          retention-days: 30

      - name: Parse Bats Results for Summary
        if: always()
        run: |
          if [ -f bats-results.tap ]; then
            echo "## Bats Test Results" >> $GITHUB_STEP_SUMMARY
            cat bats-results.tap >> $GITHUB_STEP_SUMMARY
          fi

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [pester-tests, bats-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download All Test Results
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Generate Test Summary
        run: |
          echo "## Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode 2 Pester Tests:** Check logic + resolution workflow" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode 3 Pester Tests:** Verification checks + publication workflow" >> $GITHUB_STEP_SUMMARY
          echo "- **Bats Tests:** Configuration resolution, inheritance, determinism, edge cases" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          echo "✓ Mode 2 check configuration enable/disable/default behavior" >> $GITHUB_STEP_SUMMARY
          echo "✓ Mode 2 subagent → Herdr → session fallback hierarchy" >> $GITHUB_STEP_SUMMARY
          echo "✓ Mode 2 findings parsing, markdown display, audit decisions, graceful degradation" >> $GITHUB_STEP_SUMMARY
          echo "✓ Mode 3 checks configuration, parsing, decision prompts, and audit logging" >> $GITHUB_STEP_SUMMARY
          echo "✓ Mode 3 report publication workflow across approve/override/cancel paths" >> $GITHUB_STEP_SUMMARY
          echo "✓ Edge cases (special characters, long lists, duplicates)" >> $GITHUB_STEP_SUMMARY
          echo "✓ Determinism (alphabetical sorting)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          ls -la test-results/ >> $GITHUB_STEP_SUMMARY || true

      - name: Check Test Status
        run: |
          # This step fails if either pester-tests or bats-tests failed
          if [ "${{ needs.pester-tests.result }}" != "success" ]; then
            echo "❌ Pester tests failed"
            exit 1
          fi
          if [ "${{ needs.bats-tests.result }}" != "success" ]; then
            echo "❌ Bats tests failed"
            exit 1
          fi
          echo "✓ All tests passed"
