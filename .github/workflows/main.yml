    build:
        name: Build
        needs: [setup, validate, pester-windows, pester-linux]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            artifact-metadata: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/build
              with:
                  version: ${{ needs.setup.outputs.version }}

            - name: Upload APM package artifact
              uses: actions/upload-artifact@v4
              with:
                  name: jl-agents-${{ needs.setup.outputs.version }}
                  path: |
                      jl-agents-*.tgz
                      jl-agents-*.apm
                  retention-days: 30

            - name: Upload Copilot Format
              uses: actions/upload-artifact@v4
              with:
                  name: copilot-format
                  path: |
                      .github/agents/
                      .github/skills/
                  retention-days: 30

    release:
        name: Release
        needs: [setup, build]
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/setup

            - name: Tag Commit
              shell: bash
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  TAG="v${{ needs.setup.outputs.version }}"
                  git tag $TAG
                  git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git $TAG
                  echo "✓ Created tag: $TAG"

            - name: Generate Release Notes
              id: release-notes
              shell: bash
              env:
                  RELEASE_VERSION: ${{ needs.setup.outputs.version }}
              run: |
                  node scripts/generate-release-notes.js > RELEASE_NOTES.md
                  cat RELEASE_NOTES.md >> $GITHUB_STEP_SUMMARY

            - name: Download Build Artifacts
              uses: actions/download-artifact@v4
              with:
                  name: jl-agents-${{ needs.setup.outputs.version }}
                  path: ./release-artifacts

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ needs.setup.outputs.version }}
                  body_path: RELEASE_NOTES.md
                  files: |
                      ./release-artifacts/jl-agents-*.apm
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
